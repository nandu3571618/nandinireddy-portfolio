AWSTemplateFormatVersion: '2010-09-09'
Description: 'Nandini Portfolio - AWS Serverless Architecture (S3, CloudFront OAC, API Gateway, Lambda, DynamoDB)'

Parameters:
  ProjectName:
    Type: String
    Default: nandini-portfolio
    Description: Base name for provisioned AWS resources

  NotificationEmail:
    Type: String
    Default: nandini.devcloud@gmail.com
    Description: Email address for receiving contact form notifications via Amazon SES

Resources:
  # ------------------------------------------------------------
  # 1. S3 Bucket for Static Website Hosting (Private via OAC)
  # ------------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-origin-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ------------------------------------------------------------
  # 2. CloudFront Global Edge Distribution
  # ------------------------------------------------------------
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub 'CDN Distribution for ${ProjectName}'
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # US, Canada, Europe (Lowest cost)
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        # SPA routing: Redirect 403 & 404 to index.html with HTTP 200
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # S3 Bucket Policy allowing CloudFront OAC read access
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution.Id}'

  # ------------------------------------------------------------
  # 3. DynamoDB Table for Contact Form Leads
  # ------------------------------------------------------------
  ContactTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-inquiries'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: inquiryId
          AttributeType: S
      KeySchema:
        - AttributeName: inquiryId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: false

  # ------------------------------------------------------------
  # 4. IAM Role for Lambda Function
  # ------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ContactTable.Arn
        - PolicyName: SESSendEmailPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  # ------------------------------------------------------------
  # 5. AWS Lambda Contact Handler
  # ------------------------------------------------------------
  ContactLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-contact-handler'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref ContactTable
          NOTIFICATION_EMAIL: !Ref NotificationEmail
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, PutCommand } = require('@aws-sdk/lib-dynamodb');
          const crypto = require('crypto');
          const ddb = DynamoDBDocumentClient.from(new DynamoDBClient({}));
          const cors = {
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Headers': 'Content-Type',
            'Access-Control-Allow-Methods': 'OPTIONS,POST'
          };
          exports.handler = async (event) => {
            if (event.requestContext?.http?.method === 'OPTIONS') {
              return { statusCode: 200, headers: cors, body: '' };
            }
            try {
              const b = typeof event.body === 'string' ? JSON.parse(event.body || '{}') : (event.body || {});
              if (!b.name || !b.email || !b.message) {
                return { statusCode: 400, headers: cors, body: JSON.stringify({ error: 'Missing fields' }) };
              }
              const id = crypto.randomUUID();
              await ddb.send(new PutCommand({
                TableName: process.env.DYNAMODB_TABLE,
                Item: { inquiryId: id, createdAt: new Date().toISOString(), ...b }
              }));
              return { statusCode: 200, headers: cors, body: JSON.stringify({ success: true, requestId: id }) };
            } catch(e) {
              return { statusCode: 500, headers: cors, body: JSON.stringify({ error: e.message }) };
            }
          };

  # ------------------------------------------------------------
  # 6. API Gateway HTTP API with CORS
  # ------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  ApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ContactLambdaFunction.Arn
      PayloadFormatVersion: '2.0'

  ContactApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /contact'
      Target: !Sub 'integrations/${ApiLambdaIntegration.Id}'

  ContactApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ContactLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

# ------------------------------------------------------------
# Outputs for Easy CLI & .env Configuration
# ------------------------------------------------------------
Outputs:
  CloudFrontDistributionDomain:
    Description: 'CloudFront URL for accessing Nandini Portfolio'
    Value: !GetAtt WebsiteDistribution.DomainName

  S3BucketName:
    Description: 'S3 Bucket Name for uploading compiled dist/'
    Value: !Ref WebsiteBucket

  ApiGatewayEndpoint:
    Description: 'API Gateway Endpoint to add as VITE_AWS_API_GATEWAY_URL'
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/contact'

  DynamoDBTableName:
    Description: 'DynamoDB Table storing contact form submissions'
    Value: !Ref ContactTable
